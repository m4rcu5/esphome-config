---

# Expose the node state
binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

# Core configuration
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true

# Enable logging
logger: null

# Enable Native API
api: { reboot_timeout: 0s }

# Enable the webserver
web_server: { port: 80, version: 2 }

# Enable Over-the-Air Updates
ota: { platform: esphome }

# Enable SNTP time synchronization
time:
  - platform: sntp
    id: sntp_time
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org

text_sensor:
  # Expose a short ESPHome version
  - platform: template
    lambda: |-
      auto state = id(esphome_version).state;
      return state.substr(0, state.find(' '));
    name: "${friendly_name}: ESPHome Version (Short)"
    retain: true

  # Expose the full version string
  - platform: version
    id: esphome_version
    name: "${friendly_name}: ESPHome Version"
    retain: true

# Expose a remote restart option
switch:
  - platform: restart
    name: "${friendly_name} Restart"
    disabled_by_default: true
